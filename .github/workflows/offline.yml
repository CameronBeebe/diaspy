name: Offline package gate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    env:
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest tests experiments/theory_driven/tests --disable-socket -q
      - run: python -m experiments.theory_driven.preflight --stage 0
      - run: python -m ruff check src/diaspy/cli.py src/diaspy/__init__.py tests/test_packaging.py
      - run: python -m build --installer uv
      - name: Install wheel and verify away from checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install "$GITHUB_WORKSPACE/dist/diaspy-0.1.0-py3-none-any.whl[dev]"
          cd "$RUNNER_TEMP"
          unset PYTHONPATH
          "$RUNNER_TEMP/wheel-env/bin/python" -c 'import diaspy, experiments.theory_driven; print(diaspy.__file__); print(experiments.theory_driven.__file__)'
          "$RUNNER_TEMP/wheel-env/bin/diaspy" --help
          "$RUNNER_TEMP/wheel-env/bin/diaspy" experiment --stage 0 --dry-run
          "$RUNNER_TEMP/wheel-env/bin/python" -m experiments.theory_driven.preflight --stage 0
