[project]
name = "diaspy"
version = "0.1.0"
description = "Experimental DSPy dialectical workflows and stage-zero GEPA comparisons."
authors = [{ name = "The SciPhi Initiative, LLC" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dspy==3.4.1",
    "gepa==0.1.4",
    "pydantic>=2.0,<3.0",
    "numpy>=1.24.0",
    "datasets>=3.0.0",
    "rank-bm25>=0.2.2",
    "aiohttp>=3.9.0",
    "litellm>=1.50.0",
]
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
diaspy = "diaspy.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-socket>=0.7", "pytest-timeout>=2.1", "ruff>=0.1", "pyright>=1.1", "build>=1.2", "setuptools>=61", "wheel", "uv>=0.9"]
notebooks = ["jupyter>=1", "matplotlib>=3.7", "seaborn>=0.12", "pandas>=2", "mlflow>=2.8", "scipy>=1.10", "psutil>=5.9"]

# Keep the existing import namespace canonical: the experiment imports itself
# extensively, and its acceptance tests and attributed fixture travel with it.
[tool.setuptools]
include-package-data = false

[tool.setuptools.package-dir]
diaspy = "src/diaspy"
experiments = "experiments"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["diaspy*", "experiments", "experiments.theory_driven*"]
exclude = ["experiments.theory_driven.notebooks*"]
namespaces = false

[tool.setuptools.package-data]
"experiments.theory_driven" = ["verification/pyproject.toml"]
"experiments.theory_driven.tests" = ["fixtures/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"
